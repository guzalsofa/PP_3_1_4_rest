<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-semibold" href="#">User area</a>
    <div class="text-white">
        <span id="currentUserName"></span>
        <span class="fw-light">with roles:</span>
        <span id="currentUserRoles"></span>
    </div>
    <form action="/logout" method="post" class="ms-auto">
        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
    </form>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-12 col-md-3 mb-3">
            <div class="list-group">
                <a href="/admin" class="list-group-item list-group-item-action">Admin</a>
                <span class="list-group-item list-group-item-action active">User</span>
            </div>
        </div>
        <div class="col">
            <div class="card shadow-sm">
                <div class="card-header">Profile</div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered mb-0">
                            <tbody id="profile">
                            <tr><td colspan="2">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/user.js"></script>
</body>
</html>
