<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h2>Admin panel</h2>
<a href="/user" class="btn btn-secondary mb-3">My profile</a>

<table class="table table-bordered" id="usersTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Name</th>
        <th>Age</th>
        <th>Job</th>
        <th>Roles</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<h4>Add user</h4>
<div class="row g-2">
    <div class="col"><input id="username" class="form-control" placeholder="Username"></div>
    <div class="col"><input id="password" class="form-control" placeholder="Password"></div>
    <div class="col"><input id="name" class="form-control" placeholder="Name"></div>
    <div class="col"><input id="age" class="form-control" placeholder="Age"></div>
    <div class="col"><input id="job" class="form-control" placeholder="Job"></div>
    <div class="col"><input id="roles" class="form-control" placeholder="ROLE_USER"></div>
    <div class="col"><button class="btn btn-success" onclick="addUser()">Add</button></div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
