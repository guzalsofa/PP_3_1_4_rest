<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-semibold" href="#">User administration</a>
    <div class="text-white">
        <span id="currentUserName"></span>
        <span class="fw-light">with roles:</span>
        <span id="currentUserRoles"></span>
    </div>
    <form action="/logout" method="post" class="ms-auto">
        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
    </form>
</nav>

<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12 col-md-2 mb-3 mb-md-0">
            <div class="list-group">
                <a href="/admin" class="list-group-item list-group-item-action active">Admin</a>
                <a href="/user" class="list-group-item list-group-item-action">User</a>
            </div>
        </div>
        <div class="col">
            <div id="alertBox"></div>

            <div class="card mb-4 shadow-sm">
                <div class="card-header">All users</div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped align-middle" id="usersTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Job</th>
                                <th>Roles</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header">Add new user</div>
                <div class="card-body">
                    <form id="newUserForm" class="row g-3">
                        <div class="col-md-4">
                            <label for="newUsername" class="form-label">Username</label>
                            <input id="newUsername" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="newPassword" class="form-label">Password</label>
                            <input type="password" id="newPassword" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="newName" class="form-label">Name</label>
                            <input id="newName" name="name" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="newAge" class="form-label">Age</label>
                            <input type="number" id="newAge" name="age" class="form-control" min="0">
                        </div>
                        <div class="col-md-4">
                            <label for="newJob" class="form-label">Job</label>
                            <input id="newJob" name="job" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="newRoles" class="form-label">Roles</label>
                            <select id="newRoles" name="roles" class="form-select" multiple></select>
                        </div>
                        <div class="col-12 d-flex justify-content-end">
                            <button class="btn btn-success" type="submit">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editUserForm" class="modal-body row g-3">
                <div class="col-md-3">
                    <label for="editId" class="form-label">ID</label>
                    <input id="editId" class="form-control" disabled>
                </div>
                <div class="col-md-5">
                    <label for="editUsername" class="form-label">Username</label>
                    <input id="editUsername" name="username" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label for="editPassword" class="form-label">New password</label>
                    <input type="password" id="editPassword" name="password" class="form-control" placeholder="Leave empty to keep old">
                </div>
                <div class="col-md-4">
                    <label for="editName" class="form-label">Name</label>
                    <input id="editName" name="name" class="form-control">
                </div>
                <div class="col-md-4">
                    <label for="editAge" class="form-label">Age</label>
                    <input type="number" id="editAge" name="age" class="form-control" min="0">
                </div>
                <div class="col-md-4">
                    <label for="editJob" class="form-label">Job</label>
                    <input id="editJob" name="job" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="editRoles" class="form-label">Roles</label>
                    <select id="editRoles" name="roles" class="form-select" multiple></select>
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="deleteUserForm" class="modal-body">
                <input type="hidden" id="deleteUserId">
                <p class="mb-2">Вы уверены, что хотите удалить пользователя <strong id="deleteUsername"></strong>?</p>
                <p class="text-muted mb-4">Роли: <span id="deleteRoles"></span></p>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin.js"></script>
</body>
</html>
